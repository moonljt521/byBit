name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptosim
          POSTGRES_PASSWORD: cryptosim
          POSTGRES_DB: cryptosim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptosim" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: 构建 / vet / 单测（含撮合引擎）
        working-directory: backend
        run: |
          go build ./...
          go vet ./...
          go test ./... -race -count=1

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 构建 ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: |
          npm install
          npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.24.5", channel: stable }
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cryptosim
          POSTGRES_PASSWORD: cryptosim
          POSTGRES_DB: cryptosim
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptosim" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 启动后端
        working-directory: backend
        run: |
          go build -o bin/server ./cmd/server
          ./bin/server &
          sleep 3
      - name: 启动用户端
        working-directory: frontend
        run: |
          npm install
          npm run dev &
          sleep 5
      - name: 启动管理后台
        working-directory: admin
        run: |
          npm install
          npm run dev &
          sleep 5
      - name: 运行 Playwright E2E
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
