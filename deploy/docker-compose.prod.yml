# 生产部署编排示例：TLS 由宿主 nginx 终止，内部服务不暴露端口
# 启动前必须设置环境变量（勿使用默认密钥）：
#   export SIM_JWT_SECRET=$(openssl rand -hex 32)
#   export SIM_ENC_KEY=$(openssl rand -hex 32)
#   export SIM_ALLOWED_ORIGINS=https://your.domain.com
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptosim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置强密码}
      POSTGRES_DB: cryptosim
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosim"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      SIM_ENV: production
      SIM_HTTP_ADDR: ":8080"
      SIM_DB_DSN: postgres://cryptosim:${POSTGRES_PASSWORD}@postgres:5432/cryptosim?sslmode=disable
      SIM_REDIS_ADDR: redis:6379
      SIM_JWT_SECRET: ${SIM_JWT_SECRET:?请设置 32 字节以上随机密钥}
      SIM_ENC_KEY: ${SIM_ENC_KEY:?请设置 32 字节以上随机密钥}
      SIM_ALLOWED_ORIGINS: ${SIM_ALLOWED_ORIGINS:?请设置前端域名}
      SIM_AUTH_RATE_LIMIT: "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ../frontend
    restart: unless-stopped

  admin:
    build: ../admin
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
