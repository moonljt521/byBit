services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptosim
      POSTGRES_PASSWORD: cryptosim
      POSTGRES_DB: cryptosim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosim"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SIM_ENV: production
      SIM_HTTP_ADDR: ":8080"
      SIM_DB_DSN: postgres://cryptosim:cryptosim@postgres:5432/cryptosim?sslmode=disable
      SIM_REDIS_ADDR: redis:6379
      SIM_JWT_SECRET: ${SIM_JWT_SECRET:-change-me-in-production}
      SIM_ALLOWED_ORIGINS: http://localhost,http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build: ./admin
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
