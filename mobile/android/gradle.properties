org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# 注意：不要把 org.gradle.java.home 写在这里 —— 它是机器绑定路径，
# 提交进仓库会导致其它机器构建失败（"java home is invalid"）。
# 各机器按需配置自己的 JDK 17（AGP 8.1 不兼容 JDK 21+）：
#   方式 A（推荐）：~/.gradle/gradle.properties 加 org.gradle.java.home=<本机 JDK 17 路径>
#   方式 B：Android Studio → Settings → Build Tools → Gradle → Gradle JDK 选 17
# 本机用的是 /Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
# （本机 brew 的 openjdk@17/@21/@25 软链全部坏指向 Java 25，勿用 brew 路径）
