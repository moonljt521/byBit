name: cryptosim_mobile
description: CryptoSim 虚拟加密货币交易所移动客户端（Android / iOS）
publish_to: "none"
version: 0.2.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 网络：dio + 拦截器（token / HMAC 验签 / 统一错误）
  dio: ^5.7.0
  crypto: ^3.0.7
  # 路由：go_router 声明式路由（含登录守卫）
  go_router: ^14.2.0
  # 状态管理：Riverpod
  flutter_riverpod: ^2.5.1
  # 加密存储：token / apiSecret 存 Keychain / Keystore
  flutter_secure_storage: ^9.2.2
  # 本地数据库：hive 缓存行情 / K 线（离线可见）
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: assets/icon-1024.png
  android: launcher_icon
  adaptive_icon_background: '#0B0E11'
  adaptive_icon_foreground: assets/icon-1024.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

flutter_native_splash:
  color: '#0B0E11'
  image: assets/icon-1024.png
  android_12:
    color: '#0B0E11'
    image: assets/icon-1024.png
  fullscreen: true
